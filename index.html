<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organizador</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="app">

  <aside class="lateral">
    <div class="marca">Organizador</div>

    <nav>
      <p class="rotulo">Páginas</p>
      <ul id="lista-paginas"></ul>
    </nav>

    <form id="form-pagina" autocomplete="off">
      <input id="nombre-pagina" type="text" placeholder="Nueva página" required>
      <button type="submit" title="Crear página">+</button>
    </form>

    <div class="equipo">
      <p class="rotulo">Equipo</p>
      <ul id="lista-personas"></ul>
    </div>
  </aside>

  <main class="contenido">
    <header class="cabecera">
      <h1 id="titulo-pagina"></h1>
      <div class="vistas">
        <button id="vista-tabla" class="activa" type="button">Tabla</button>
        <button id="vista-kanban" type="button">Tablero</button>
      </div>
    </header>

    <form id="form-tarea" autocomplete="off">
      <input id="titulo-tarea" type="text" placeholder="Agregar una tarea" required>
      <button type="submit">Agregar</button>
    </form>

    <section id="panel"></section>
  </main>

</div>

<script src="js/almacen.js"></script>
<script src="js/tabla.js"></script>
<script src="js/kanban.js"></script>
<script src="js/app.js"></script>
</body>
</html>
