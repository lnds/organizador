<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organizador</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header>
  <h1>Organizador</h1>
  <p class="bajada">Lo que hay que hacer, en un solo lugar.</p>
</header>

<main>
  <form id="form-tarea" autocomplete="off">
    <input id="titulo" type="text" placeholder="¿Qué hay que hacer?" required>
    <button type="submit">Agregar</button>
  </form>

  <p id="resumen" class="resumen"></p>

  <ul id="lista"></ul>

  <p id="vacio" class="vacio">Todavía no hay tareas. Agrega la primera arriba.</p>
</main>

<script src="js/almacen.js"></script>
<script src="js/app.js"></script>
</body>
</html>
