<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organizador</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="app">

  <aside class="lateral">
    <div class="marca">Organizador</div>

    <nav>
      <p class="rotulo">Páginas</p>
      <ul id="lista-paginas"></ul>
    </nav>

    <form id="form-pagina" autocomplete="off">
      <input id="nombre-pagina" type="text" placeholder="Nueva página" required>
      <button type="submit" title="Crear página">+</button>
    </form>

    <div id="zona-archivadas">
      <button id="ver-archivadas" type="button" class="enlace"></button>
      <ul id="lista-archivadas" hidden></ul>
    </div>

    <div class="equipo">
      <p class="rotulo">Equipo</p>
      <ul id="lista-personas"></ul>
    </div>
  </aside>

  <main class="contenido">
    <header class="cabecera">
      <h1><input id="titulo-pagina" type="text" aria-label="Nombre de la página"></h1>
      <div class="vistas">
        <button id="vista-tabla" class="activa" type="button">Tabla</button>
        <button id="vista-kanban" type="button">Tablero</button>
      </div>
      <div class="menu">
        <button id="abrir-menu" type="button" class="mas" aria-label="Opciones de la página" aria-haspopup="true" aria-expanded="false">···</button>
        <div id="menu-pagina" class="menu-lista" hidden>
          <button id="archivar-pagina" type="button">Archivar página</button>
        </div>
      </div>
    </header>

    <textarea id="texto-pagina" placeholder="Escribe aquí de qué se trata esta página…"></textarea>

    <div class="barra-adjuntar">
      <label class="adjuntar">
        Adjuntar archivo
        <input id="campo-adjunto" type="file" multiple hidden>
      </label>
      <span id="error-adjunto" class="error"></span>
    </div>

    <section id="adjuntos"></section>

    <form id="form-tarea" autocomplete="off">
      <input id="titulo-tarea" type="text" placeholder="Agregar una tarea" required>
      <button type="submit">Agregar</button>
    </form>

    <section id="panel"></section>
  </main>

</div>

<script src="js/almacen.js"></script>
<script src="js/markdown.js"></script>
<script src="js/adjuntos.js"></script>
<script src="js/tabla.js"></script>
<script src="js/kanban.js"></script>
<script src="js/app.js"></script>
</body>
</html>
